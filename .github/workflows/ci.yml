name: Check and deploy Pages
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enforce Conventional Commits after the legacy history
        run: npm run commits:check
      - name: Check the PR title for squash merges
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npm exec -- commitlint
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run checks in the visual baseline environment
        run: |
          docker build -f Dockerfile.test -t instant-bible:test .
          mkdir -p playwright-report test-results
          docker run --rm --ipc=host -e CI=true \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            instant-bible:test
      - name: Verify production container
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t instant-bible:check .
          docker run -d --name bible-check -p 8080:80 instant-bible:check
          docker cp bible-check:/usr/share/nginx/html/. dist
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break || sleep 1; done
          test "$(curl -fsS http://localhost:8080/healthz)" = ok
          curl -fsS 'http://localhost:8080/John/3/16?version=BSB' | cmp - dist/index.html
          check_header() {
            curl -fsSI "http://localhost:8080/$1" | tr -d '\r' | grep -Fxi "$2"
          }
          check_header index.html 'Cache-Control: no-cache'
          check_header sw.js 'Cache-Control: no-cache'
          check_header sw.js 'Service-Worker-Allowed: /'
          check_header manifest.webmanifest 'Cache-Control: no-cache'
          check_header bibles/v1/BSB/metadata.json 'Cache-Control: no-cache'
          asset=$(find dist/assets -name '*.js' -print -quit)
          check_header "${asset#dist/}" 'Cache-Control: public, max-age=31536000, immutable'
          book=$(find dist/bibles/v1/BSB -name '*.json' ! -name metadata.json -print -quit)
          check_header "${book#dist/}" 'Cache-Control: public, max-age=31536000, immutable'
          font=$(find dist/fonts -name '*.woff2' -print -quit)
          check_header "${font#dist/}" 'Cache-Control: public, max-age=86400'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [commits, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.result.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Skip a superseded source revision
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Seed the existing 0.1.0 release before automated versioning
        if: steps.current.outputs.current == 'true'
        run: |
          if ! git rev-parse --verify --quiet refs/tags/v0.1.0; then
            git tag v0.1.0 9b3e387
            git push origin refs/tags/v0.1.0
          fi
      - name: Release from Conventional Commits
        if: steps.current.outputs.current == 'true'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the versioned source for deployment
        if: steps.current.outputs.current == 'true'
        id: result
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.sha != ''
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      - name: Build for the Pages URL
        run: npm run build:pages && npm run bundle:check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          BUILD_SHA: ${{ needs.release.outputs.sha }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
