name: Check and publish
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run checks in the visual baseline environment
        run: |
          docker build -f Dockerfile.test -t instant-bible:test .
          mkdir -p playwright-report test-results
          docker run --rm --ipc=host -e CI=true \
            -v "$PWD/playwright-report:/app/playwright-report" \
            -v "$PWD/test-results:/app/test-results" \
            instant-bible:test
      - name: Verify production container
        run: |
          docker build --build-arg BUILD_SHA=${{ github.sha }} -t instant-bible:check .
          docker run -d --name bible-check -p 8080:80 instant-bible:check
          docker cp bible-check:/usr/share/nginx/html/. dist
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break || sleep 1; done
          test "$(curl -fsS http://localhost:8080/healthz)" = ok
          curl -fsS 'http://localhost:8080/John/3/16?version=BSB' | cmp - dist/index.html
          check_header() {
            curl -fsSI "http://localhost:8080/$1" | tr -d '\r' | grep -Fxi "$2"
          }
          check_header index.html 'Cache-Control: no-cache'
          check_header sw.js 'Cache-Control: no-cache'
          check_header sw.js 'Service-Worker-Allowed: /'
          check_header manifest.webmanifest 'Cache-Control: no-cache'
          check_header bibles/v1/BSB/metadata.json 'Cache-Control: no-cache'
          asset=$(find dist/assets -name '*.js' -print -quit)
          check_header "${asset#dist/}" 'Cache-Control: public, max-age=31536000, immutable'
          book=$(find dist/bibles/v1/BSB -name '*.json' ! -name metadata.json -print -quit)
          check_header "${book#dist/}" 'Cache-Control: public, max-age=31536000, immutable'
          font=$(find dist/fonts -name '*.woff2' -print -quit)
          check_header "${font#dist/}" 'Cache-Control: public, max-age=86400'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: BUILD_SHA=${{ github.sha }}
          tags: |
            ghcr.io/timunrau/instant-bible:latest
            ghcr.io/timunrau/instant-bible:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm ci
      - name: Build for the Pages URL
        run: npm run build:pages && npm run bundle:check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/deploy-pages@v5
        id: deployment
