server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
  location = /index.html { add_header Cache-Control 'no-cache'; }
  location = /sw.js { add_header Cache-Control 'no-cache'; add_header Service-Worker-Allowed '/'; }
  location = /manifest.webmanifest { add_header Cache-Control 'no-cache'; }
  location /assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
  location = /bibles/v1/BSB/metadata.json { add_header Cache-Control 'no-cache'; }
  location /bibles/v1/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
  location /fonts/ { try_files $uri =404; add_header Cache-Control 'public, max-age=86400'; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control 'no-cache'; }
}
